# Comprueba la app y genera APKs; puede publicar una versión usando secretos de firma.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar APK firmado y activar la actualización'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas, revisión y APK de desarrollo
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Pulso-desarrollo-no-instalar-como-actualizacion
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar APK sin firma para firmarlo localmente
        run: |
          mkdir -p local-signing
          cp app/build/outputs/apk/release/app-release-unsigned.apk local-signing/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" local-signing/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" local-signing/
      - uses: actions/upload-artifact@v4
        with:
          name: Pulso-para-firma-local
          path: local-signing/

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar la firma privada
        env:
          KEYSTORE: ${{ secrets.PULSO_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.PULSO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo 'Faltan los dos secretos de firma. Consulta docs/ACTUALIZACIONES.md.'
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pulso.jks"
          chmod 600 "$RUNNER_TEMP/pulso.jks"
      - name: Compilar APK firmado
        env:
          PULSO_KEYSTORE_PATH: ${{ runner.temp }}/pulso.jks
          PULSO_KEYSTORE_PASSWORD: ${{ secrets.PULSO_KEYSTORE_PASSWORD }}
        run: |
          bash gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Preparar archivos de la actualización
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Pulso.apk
          python3 tools/make_update.py release/Pulso.apk release/update.json
          git archive --format=zip --output=release/Pulso-source.zip HEAD
      - name: Publicar versión completa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release/update.json"))["versionName"])')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'La etiqueta debe coincidir con version.properties.'
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Esta versión ya existe. Sube versionCode y versionName antes de publicar otra.'
            exit 1
          fi
          gh release create "$TAG" release/Pulso.apk release/update.json release/Pulso-source.zip --target "$GITHUB_SHA" --title "Pulso $VERSION" --notes-file CHANGELOG.md --draft
          gh release edit "$TAG" --draft=false --latest
      - name: Eliminar copia temporal de la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/pulso.jks"
